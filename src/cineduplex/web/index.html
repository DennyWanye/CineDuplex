<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CineDuplex · 声音实验室</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#182638;background:#f2f5f8}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:36px 24px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:36px}h1{font-size:30px;margin:0 0 8px;letter-spacing:-1px}h2{font-size:20px;margin:0 0 18px}p{line-height:1.65;color:#677486}small{color:#6d7989}.brand{font-size:13px;font-weight:700;letter-spacing:2px;color:#4a6b9a;margin-bottom:12px}.badge{border:1px solid #cbd6e3;padding:9px 16px;border-radius:30px;background:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:white;border:1px solid #dbe3ec;border-radius:18px;padding:24px;margin-bottom:20px}.number{font-size:32px;font-weight:650;margin:9px 0}.workspace{display:grid;grid-template-columns:1fr 1fr;gap:20px}button{background:#245bd6;color:white;border:0;padding:12px 18px;border-radius:10px;cursor:pointer;font:inherit}button:disabled{opacity:.4;cursor:default}.secondary{background:#edf2fb;color:#28508e}input{margin:12px 0 22px;width:100%}.drop{border:1px dashed #b0c1d7;background:#f8faff;border-radius:12px;padding:24px}.result{padding:15px 0;border-bottom:1px solid #e8edf3}audio{width:100%;margin:10px 0}.error{color:#b74435}.hint{font-size:13px}.row{display:flex;gap:10px;align-items:center}progress{width:100%;height:8px;accent-color:#245bd6}#examples .sample{margin-bottom:14px;padding:12px;border-radius:10px;background:#f8fafc}#examples p{margin:5px 0;font-size:14px}.split{font-size:12px;color:#6c798a}@media(max-width:750px){.workspace,.grid{grid-template-columns:1fr}header{align-items:flex-start;gap:12px}.number{font-size:26px}}
</style><main><header><div><div class="brand">CINEDUPLEX / AUDIO LAB</div><h1>声音实验室</h1><small>上传一句话，比较原始模型和本次训练模型的回答。</small></div><span class="badge" id="phase">读取状态…</span></header>
<div class="grid"><section class="card"><small>本次训练输入</small><div class="number" id="train">—</div><span class="split">按原录制分组，与评估输入分开</span></section><section class="card"><small>独立评估输入</small><div class="number" id="eval">—</div><span class="split">保留原音和文字供对照</span></section><section class="card"><small>训练步数 / 当前损失</small><div class="number" id="step">—</div><span class="split" id="loss">等待真实训练记录</span></section></div>
<div class="workspace"><section class="card"><h2>测试一段声音</h2><div class="drop"><strong>选择音频文件</strong><p class="hint">WAV、MP3、M4A，0.3–12 秒。页面自动转换格式，也可使用下面的评估样本。</p><input type="file" id="file" accept="audio/*,.wav,.mp3,.m4a"><audio id="preview" controls hidden></audio><button id="submit" disabled>生成回答并对比</button></div><p id="ready" class="hint">正在读取模型状态。</p><p id="message" role="status"></p><div id="results"></div></section>
<section class="card"><h2>评估样本</h2><p class="hint">这些样本没有用于本次训练。先听上下文，再选择测试。原回答是对照素材。</p><div id="examples"></div></section></div><footer><p class="hint" id="version"></p><p class="hint">本次能力是听一句、答一句。页面展示真实生成结果；声音质量仍需试听。</p></footer></main>
<script>
let blob=null,modelReady=false,active=null;const el=id=>document.getElementById(id);const phases={PREPARING:'准备训练输入',LOADING_MODEL:'加载模型',TRAINING:'正在训练',TRAINING_COMPLETE:'训练已完成',FAILED:'执行失败',NAS_UNAVAILABLE:'存储不可用'};
async function json(url,opt){let r=await fetch(url,opt),j=await r.json();if(!r.ok)throw Error(j.error||'服务暂不可用');return j}
async function status(){try{let s=await json('/api/status');modelReady=s.model_ready;el('phase').textContent=modelReady?'模型已就绪':phases[s.phase]||s.phase;el('train').textContent=(s.train_rows||0).toLocaleString()+' 条';el('eval').textContent=(s.eval_rows||0).toLocaleString()+' 条';el('step').textContent=s.step?(s.step+' / '+s.total_steps):'—';el('loss').textContent=s.loss_global_mean!=null?'实际损失 '+s.loss_global_mean.toFixed(4):'等待真实训练记录';el('version').textContent='任务 '+s.run_id+' · 模型 '+(s.service?.model||'测试模型尚未就绪');el('ready').textContent=modelReady?'模型已就绪，可以开始测试。':s.phase==='FAILED'?'执行失败，已保留检查点，正在处理。':'训练或模型加载尚未完成。可以先试听样本，模型就绪后再提交。';el('submit').disabled=!modelReady||!blob||active}catch(e){el('phase').textContent='连接中断';el('ready').textContent=e.message;el('submit').disabled=true}}
function select(b){blob=b;if(el('preview').src.startsWith('blob:'))URL.revokeObjectURL(el('preview').src);el('preview').src=URL.createObjectURL(b);el('preview').hidden=false;status()}
async function normalize(file){
 if(file.size>5*1024*1024)throw Error('音频文件最多5MB');
 let context=new AudioContext(),decoded;
 try{decoded=await context.decodeAudioData(await file.arrayBuffer())}finally{await context.close()}
 if(decoded.duration<.3||decoded.duration>12)throw Error('请选择0.3到12秒的音频');
 let count=Math.round(decoded.duration*16000),offline=new OfflineAudioContext(1,count,16000);
 let mono=offline.createBuffer(1,decoded.length,decoded.sampleRate),samples=mono.getChannelData(0);
 for(let c=0;c<decoded.numberOfChannels;c++){let channel=decoded.getChannelData(c);for(let i=0;i<samples.length;i++)samples[i]+=channel[i]/decoded.numberOfChannels}
 let source=offline.createBufferSource();source.buffer=mono;source.connect(offline.destination);source.start();
 let output=(await offline.startRendering()).getChannelData(0),bytes=new ArrayBuffer(44+count*2),view=new DataView(bytes);
 function word(at,s){for(let i=0;i<s.length;i++)view.setUint8(at+i,s.charCodeAt(i))}
 word(0,'RIFF');view.setUint32(4,36+count*2,true);word(8,'WAVE');word(12,'fmt ');view.setUint32(16,16,true);
 view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,16000,true);view.setUint32(28,32000,true);
 view.setUint16(32,2,true);view.setUint16(34,16,true);word(36,'data');view.setUint32(40,count*2,true);
 for(let i=0;i<count;i++)view.setInt16(44+i*2,Math.round(Math.max(-1,Math.min(1,output[i]))*32767),true);
 return new Blob([bytes],{type:'audio/wav'});
}
el('file').onchange=async()=>{let file=el('file').files[0];if(!file)return;blob=null;el('submit').disabled=true;el('message').textContent='正在准备音频…';try{select(await normalize(file));el('message').textContent='音频已准备，可以试听。'}catch(e){el('message').textContent=e.message;status()}};
async function poll(id){try{let j=await json('/api/jobs/'+id);el('message').textContent={QUEUED:'已排队',RUNNING:'模型正在生成回答',SUCCEEDED:'真实音频已生成',FAILED:'生成失败'}[j.state]||j.state;if(j.state==='SUCCEEDED'){for(let [v,label] of [['input','输入原音'],['base','原始模型'],['trained','本次训练模型']]){let div=document.createElement('div');div.className='result';let title=document.createElement('strong');title.textContent=label;div.append(title);let a=document.createElement('audio');a.controls=true;a.src='/api/jobs/'+id+'/'+v;div.append(a);if(j[v+'_text']){let p=document.createElement('p');p.textContent=j[v+'_text'];div.append(p)}el('results').append(div)}active=null;status();return}if(j.state==='FAILED'){el('message').textContent=j.error||'生成失败';active=null;status();return}setTimeout(()=>poll(id),2000)}catch(e){el('message').textContent=e.message;setTimeout(()=>poll(id),5000)}}
el('submit').onclick=async()=>{el('submit').disabled=true;el('results').replaceChildren();el('message').textContent='正在上传…';try{let j=await json('/api/jobs',{method:'POST',headers:{'Content-Type':'audio/wav'},body:blob});active=j.id;poll(j.id)}catch(e){el('message').textContent=e.message;status()}};
json('/api/examples').then(items=>{for(let r of items){let div=document.createElement('div');div.className='sample';let p=document.createElement('p');p.textContent=r.context_text||'上下文原音';div.append(p);let a=document.createElement('audio');a.controls=true;a.preload='none';a.src=r.input_url;div.append(a);let t=document.createElement('p');t.textContent='原回答：'+r.target_text;div.append(t);let original=document.createElement('audio');original.controls=true;original.preload='none';original.src=r.target_url;original.setAttribute('aria-label','原回答音频');div.append(original);let b=document.createElement('button');b.className='secondary';b.textContent='用这段上下文测试';b.onclick=async()=>select(await (await fetch(r.input_url)).blob());div.append(b);el('examples').append(div)}});status();setInterval(status,5000);
</script></html>
