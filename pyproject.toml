[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cineduplex"
version = "0.3.0"
description = "Source-backed speech data preparation, BF16 training, and native full-duplex audio testing"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cineduplex = "cineduplex.data.workflow:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cineduplex", "cineduplex.data", "cineduplex.guardrail", "cineduplex.train", "cineduplex.web", "cineduplex.cluster"]

[tool.setuptools.package-data]
"cineduplex.web" = ["*.html", "*.js", "*.css", "*.png"]
