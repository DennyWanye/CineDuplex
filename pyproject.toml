[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cineduplex"
version = "0.1.0"
description = "Source-backed emotional speech and duplex data preparation with explicit review gates"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cineduplex = "cineduplex.data.workflow:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cineduplex", "cineduplex.data"]
